[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uteki-eval"
version = "0.1.0"
description = "Evaluation kernel for Uteki"
requires-python = ">=3.11"
dependencies = ["lxml>=5,<7"]

[project.optional-dependencies]
analysis = ["openai-agents==0.22.2"]
data = ["duckdb==1.5.5", "pydantic>=2.12,<3"]

[project.scripts]
uteki-eval = "uteki_eval.cli:main"
uteki-data = "uteki.infrastructure.research_data.query_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
